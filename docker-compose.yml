services:
  app:
    build: .
    ports:
      - "8080:8080" # Map to your app's UI/API
    environment:
      # Tell LangChain where to find the services on the Docker network
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_PORT=8000
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
    depends_on:
      - chromadb
    container_name: app

  chromadb:
    image: chromadb/chroma
    volumes:
      # Persist the vector database locally
      - chroma-data:./chroma_langchain_db
    ports:
      - "8000:8000"

volumes:
  chroma-data:
  