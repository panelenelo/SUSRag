services:
  app:
    build: .
    ports:
      - "8080:8080" # Map to your app's UI/API
    environment:
      # Tell LangChain where to find the services on the Docker network
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - chromadb
      - ollama

  chromadb:
    image: chromadb/chroma:latest
    volumes:
      # Persist the vector database locally
      - chroma-data:/chroma/chroma
    ports:
      - "8000:8000"

  ollama:
    image: ollama/ollama:latest
    volumes:
      # Persist downloaded models
      - ollama-data:/home/dew/.ollama/
    ports:
      - "11434:11434"

volumes:
  chroma-data:
  ollama-data: